<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Absensi Tukang — Guna Merta Home Service</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#14181C; --blueprint:#1C3F52; --blueprint-dark:#12303F;
    --concrete:#9AA5AC; --border:#DDD9CC; --canvas:#EDEDE6;
    --ok:#2C7A3D; --ok-bg:#E6F4E9; --bad:#B23B3B; --bad-bg:#FDECEC;
    --yellow:#F5B700;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--canvas);color:var(--ink);}
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap');
  .display{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em;}
  header{background:var(--blueprint);color:#fff;padding:20px 18px 16px;position:sticky;top:0;z-index:20;}
  header h1{margin:0;font-size:22px;font-weight:700;text-transform:uppercase;}
  header p{margin:2px 0 0;font-size:12px;color:#A9C4D2;}
  main{max-width:480px;margin:0 auto;padding:16px;padding-bottom:90px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  label{font-size:12px;font-weight:600;color:#6B7278;display:block;margin-bottom:4px;}
  select,input{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff;color:var(--ink);}
  select:focus,input:focus{outline:2px solid var(--blueprint);outline-offset:1px;}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:10px;font-weight:600;font-size:14px;border:none;cursor:pointer;color:#fff;background:var(--blueprint);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-outline{background:#fff;color:#6B7278;border:1px solid var(--border);}
  .btn-sm{padding:8px 12px;font-size:12px;width:auto;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0;max-width:480px;margin:0 auto;}
  nav.bottom button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;color:var(--concrete);font-size:11px;font-weight:600;cursor:pointer;}
  nav.bottom button.active{color:var(--blueprint);}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-bad{background:var(--bad-bg);color:var(--bad);}
  .tukang-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #F0EEE4;}
  .tukang-item:last-child{border-bottom:none;}
  .tukang-nama{font-weight:600;font-size:14px;}
  .tukang-sub{font-size:12px;color:#6B7278;margin-top:2px;}
  .radar{position:relative;width:150px;height:150px;margin:6px auto;display:flex;align-items:center;justify-content:center;}
  .radar-ring{position:absolute;width:140px;height:140px;border-radius:50%;border:2px solid var(--blueprint);opacity:.2;}
  .radar-pulse{position:absolute;border-radius:50%;transition:all .6s ease;}
  .radar-dot{position:relative;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background-color .5s;}
  .status-text{text-align:center;font-size:13px;font-weight:600;min-height:20px;margin-top:4px;}
  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .photo-card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;position:relative;}
  .photo-card img{width:100%;height:120px;object-fit:cover;display:block;}
  .photo-meta{padding:8px;}
  .photo-meta p{margin:0;font-size:11px;}
  .photo-meta .p-proyek{font-weight:600;}
  .photo-meta .p-sub{color:#6B7278;margin-top:2px;}
  .del-btn{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);border:none;color:#fff;border-radius:999px;width:22px;height:22px;font-size:12px;cursor:pointer;}
  .empty{text-align:center;padding:36px 10px;color:var(--concrete);font-size:13px;}
  .toggle-btn{font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;border:none;color:#fff;cursor:pointer;}
  .hint{font-size:11px;color:var(--concrete);margin-top:6px;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{width:100%;max-width:340px;text-align:center;}
  .logo-dot{width:52px;height:52px;background:var(--blueprint);border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;}
  .hidden{display:none !important;}
  .config-warning{background:#FDECEC;color:#B23B3B;padding:12px;border-radius:10px;font-size:12px;margin-bottom:14px;}
</style>
</head>
<body>

<!-- ============ LOGIN VIEW ============ -->
<div id="view-login" class="login-wrap">
  <div class="login-box">
    <div class="logo-dot">GM</div>
    <h1 class="display" style="font-size:22px;margin:0 0 4px;">Absensi Tukang</h1>
    <p style="font-size:13px;color:#6B7278;margin:0 0 20px;">Guna Merta Home Service</p>
    <div class="card" style="text-align:left;">
      <label>Pilih Nama</label>
      <select id="login-tukang"></select>
      <label style="margin-top:12px;">PIN (4 digit)</label>
      <input id="login-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" />
      <button class="btn" style="margin-top:14px;" onclick="handleLogin()">Masuk</button>
      <p id="login-error" class="hint" style="color:var(--bad);"></p>
      <button class="btn btn-outline" style="margin-top:8px;" onclick="showAdminLogin()">Masuk sebagai Admin</button>
    </div>
  </div>
</div>

<!-- ============ ADMIN LOGIN ============ -->
<div id="view-admin-login" class="login-wrap hidden">
  <div class="login-box">
    <div class="logo-dot">A</div>
    <h1 class="display" style="font-size:22px;margin:0 0 14px;">Masuk Admin</h1>
    <div class="card" style="text-align:left;">
      <label>Kata Sandi Admin</label>
      <input id="admin-pass" type="password" placeholder="Kata sandi" />
      <button class="btn" style="margin-top:14px;" onclick="handleAdminLogin()">Masuk</button>
      <p id="admin-login-error" class="hint" style="color:var(--bad);"></p>
      <button class="btn btn-outline" style="margin-top:8px;" onclick="showTukangLogin()">← Kembali</button>
    </div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="view-app" class="hidden">
  <header>
    <h1 class="display" id="header-title">Absensi Tukang</h1>
    <p id="header-sub">—</p>
  </header>

  <main>
    <div id="config-warning" class="config-warning hidden">
      Supabase belum dikonfigurasi. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian atas file ini.
    </div>

    <!-- TAB: ABSENSI -->
    <section id="tab-absensi">
      <div class="card">
        <label>Proyek</label>
        <select id="absen-proyek" onchange="onProyekChange()"></select>
        <p class="hint" id="absen-proyek-info"></p>
      </div>
      <div class="card" style="text-align:center;">
        <div class="radar">
          <div class="radar-ring"></div>
          <div class="radar-pulse" id="radar-pulse" style="width:0;height:0;background:#9AA5AC;opacity:.2;"></div>
          <div class="radar-dot" id="radar-dot" style="background:#9AA5AC;">📍</div>
        </div>
        <p class="status-text" id="absen-status">Tekan tombol untuk absen di lokasi proyek</p>
        <button class="btn" onclick="handleCheckIn()">Absen di Lokasi Ini</button>
        <p class="hint">Pastikan GPS & izin lokasi browser aktif.</p>
      </div>
      <div id="absen-riwayat"></div>
    </section>

    <!-- TAB: FOTO -->
    <section id="tab-foto" class="hidden">
      <div class="card">
        <label>Proyek</label>
        <select id="foto-proyek"></select>
        <label style="margin-top:10px;">Keterangan pekerjaan</label>
        <input id="foto-caption" placeholder="cth: pasang keramik lantai 1" />
        <input type="file" id="foto-input" accept="image/*" capture="environment" multiple class="hidden" onchange="handlePhotoUpload(event)" />
        <button class="btn" style="margin-top:12px;" onclick="document.getElementById('foto-input').click()">📷 Ambil / Unggah Foto</button>
      </div>
      <div id="foto-grid"></div>
    </section>

    <!-- TAB: TUKANG (admin only) -->
    <section id="tab-tukang" class="hidden">
      <div class="card">
        <p class="display" style="font-size:17px;font-weight:700;margin:0 0 8px;">Tambah Tukang</p>
        <label>Nama</label>
        <input id="new-nama" placeholder="Nama lengkap" />
        <label style="margin-top:8px;">Keahlian</label>
        <input id="new-keahlian" placeholder="cth: Tukang Batu" />
        <label style="margin-top:8px;">No. HP</label>
        <input id="new-hp" placeholder="08xx" />
        <label style="margin-top:8px;">PIN (4 digit)</label>
        <input id="new-pin" maxlength="4" inputmode="numeric" placeholder="4 digit" />
        <button class="btn" style="margin-top:12px;" onclick="handleAddTukang()">Tambah</button>
      </div>
      <div class="card" id="tukang-list-card">
        <p class="display" style="font-size:17px;font-weight:700;margin:0 0 4px;">Daftar Tukang</p>
        <div id="tukang-list"></div>
      </div>
    </section>
  </main>

  <nav class="bottom">
    <button id="nav-absensi" onclick="switchTab('absensi')" class="active">📍<span>Absensi</span></button>
    <button id="nav-foto" onclick="switchTab('foto')">📷<span>Foto Kerja</span></button>
    <button id="nav-tukang" onclick="switchTab('tukang')" class="hidden-admin hidden">👥<span>Tukang</span></button>
    <button onclick="handleLogout()">🚪<span>Keluar</span></button>
  </nav>
</div>

<script>
/* =====================================================================
   KONFIGURASI SUPABASE — isi sebelum deploy
   ===================================================================== */
const SUPABASE_URL = "https://hawzalwaouwimtrerowm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5UueLSYBPZ2J1CI4r4YHpQ_c4D9qYjp";

/* =====================================================================
   SKEMA TABEL (jalankan di Supabase SQL editor sebelum pakai app ini)
   ---------------------------------------------------------------------
   create table tukang (
     id uuid primary key default gen_random_uuid(),
     nama text not null,
     keahlian text,
     hp text,
     pin text not null,              -- simpan hash di produksi, ini contoh sederhana
     verified boolean default false,
     ktp_url text,
     selfie_url text,
     created_at timestamptz default now()
   );

   create table proyek (
     id uuid primary key default gen_random_uuid(),
     nama text not null,
     alamat text,
     lat double precision not null,
     lng double precision not null,
     radius_m integer default 100,
     aktif boolean default true,
     created_at timestamptz default now()
   );

   create table absensi_log (
     id uuid primary key default gen_random_uuid(),
     tukang_id uuid references tukang(id),
     proyek_id uuid references proyek(id),
     lat double precision,
     lng double precision,
     jarak_m integer,
     valid boolean,
     created_at timestamptz default now()
   );

   create table foto_kerja (
     id uuid primary key default gen_random_uuid(),
     tukang_id uuid references tukang(id),
     proyek_id uuid references proyek(id),
     foto_url text not null,
     keterangan text,
     created_at timestamptz default now()
   );

   -- Storage bucket "foto-kerja" (buat lewat dashboard Supabase, set publik atau signed URL)
   -- Aktifkan RLS pada semua tabel dan buat policy sesuai kebutuhan
     (contoh: tukang hanya boleh insert absensi_log/foto_kerja miliknya sendiri;
      hanya admin yang boleh update kolom verified di tabel tukang)
   ===================================================================== */

const ADMIN_PASSWORD = "admin123"; // ganti sebelum deploy

let supabase = null;
let configured = SUPABASE_URL.indexOf("YOUR-PROJECT") === -1 && SUPABASE_ANON_KEY.indexOf("YOUR-ANON-KEY") === -1;
if (configured) {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let currentTukang = null; // { id, nama, verified, ... }
let isAdmin = false;
let tukangList = [];
let proyekList = [];
let selectedProyek = null;

/* ---------- util ---------- */
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString("id-ID", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
}
function fileToDataUrl(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}

/* ---------- data contoh dipakai kalau Supabase belum dikonfigurasi ---------- */
const DEMO_TUKANG = [
  { id:"t1", nama:"Wayan Sudira", keahlian:"Tukang Batu & Bangunan", hp:"0812xxxxxx01", pin:"1111", verified:true },
  { id:"t2", nama:"Made Arta", keahlian:"Listrik & Plumbing", hp:"0812xxxxxx02", pin:"2222", verified:true },
  { id:"t3", nama:"Nengah Suarta", keahlian:"Cat & Finishing", hp:"0812xxxxxx03", pin:"3333", verified:false },
];
const DEMO_PROYEK = [
  { id:"p1", nama:"Renovasi Villa Umalas", alamat:"Jl. Umalas I, Kerobokan", lat:-8.6580, lng:115.1590, radius_m:100 },
  { id:"p2", nama:"Bakery & Gelato Sanur", alamat:"Jl. Danau Tamblingan, Sanur", lat:-8.6900, lng:115.2620, radius_m:80 },
  { id:"p3", nama:"Rumah Tinggal Jimbaran", alamat:"Jl. Uluwatu II, Jimbaran", lat:-8.7850, lng:115.1650, radius_m:100 },
];
let absensiLogLocal = [];
let fotoLogLocal = [];

/* ---------- load data ---------- */
async function loadData() {
  if (configured) {
    const { data: t } = await supabase.from("tukang").select("*").order("nama");
    const { data: p } = await supabase.from("proyek").select("*").eq("aktif", true).order("nama");
    tukangList = t || [];
    proyekList = p || [];
  } else {
    tukangList = DEMO_TUKANG;
    proyekList = DEMO_PROYEK;
    document.getElementById("config-warning").classList.remove("hidden");
  }
  selectedProyek = proyekList[0] || null;
  renderLoginSelect();
}

function renderLoginSelect() {
  const sel = document.getElementById("login-tukang");
  sel.innerHTML = tukangList.map(t => `<option value="${t.id}">${t.nama}${t.verified ? "" : " (belum terverifikasi)"}</option>`).join("");
}

/* ---------- login ---------- */
function showAdminLogin() {
  document.getElementById("view-login").classList.add("hidden");
  document.getElementById("view-admin-login").classList.remove("hidden");
}
function showTukangLogin() {
  document.getElementById("view-admin-login").classList.add("hidden");
  document.getElementById("view-login").classList.remove("hidden");
}

async function handleLogin() {
  const id = document.getElementById("login-tukang").value;
  const pin = document.getElementById("login-pin").value;
  const t = tukangList.find(x => x.id === id);
  const err = document.getElementById("login-error");
  if (!t) { err.textContent = "Pilih nama terlebih dahulu."; return; }
  if (!t.verified) { err.textContent = "Akun ini belum diverifikasi admin."; return; }
  if (t.pin !== pin) { err.textContent = "PIN salah."; return; }
  err.textContent = "";
  currentTukang = t;
  isAdmin = false;
  enterApp();
}

function handleAdminLogin() {
  const pass = document.getElementById("admin-pass").value;
  const err = document.getElementById("admin-login-error");
  if (pass !== ADMIN_PASSWORD) { err.textContent = "Kata sandi salah."; return; }
  err.textContent = "";
  isAdmin = true;
  currentTukang = null;
  enterApp();
}

function handleLogout() {
  currentTukang = null;
  isAdmin = false;
  document.getElementById("view-app").classList.add("hidden");
  document.getElementById("view-admin-login").classList.add("hidden");
  document.getElementById("view-login").classList.remove("hidden");
  document.getElementById("login-pin").value = "";
}

function enterApp() {
  document.getElementById("view-login").classList.add("hidden");
  document.getElementById("view-admin-login").classList.add("hidden");
  document.getElementById("view-app").classList.remove("hidden");
  document.getElementById("header-title").textContent = isAdmin ? "Panel Admin" : "Absensi Tukang";
  document.getElementById("header-sub").textContent = isAdmin ? "Kelola tukang & proyek" : `Halo, ${currentTukang.nama}`;
  document.querySelectorAll(".hidden-admin").forEach(el => el.classList.toggle("hidden", !isAdmin));
  renderProyekSelects();
  renderTukangList();
  renderAbsensiRiwayat();
  renderFotoGrid();
  switchTab("absensi");
}

/* ---------- tabs ---------- */
function switchTab(tab) {
  ["absensi", "foto", "tukang"].forEach(t => {
    document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
    document.getElementById("nav-" + t).classList.toggle("active", t === tab);
  });
}

/* ---------- proyek select ---------- */
function renderProyekSelects() {
  const opts = proyekList.map(p => `<option value="${p.id}">${p.nama}</option>`).join("");
  document.getElementById("absen-proyek").innerHTML = opts;
  document.getElementById("foto-proyek").innerHTML = opts;
  onProyekChange();
}
function onProyekChange() {
  const id = document.getElementById("absen-proyek").value;
  selectedProyek = proyekList.find(p => p.id === id) || proyekList[0];
  document.getElementById("absen-proyek-info").textContent = selectedProyek ? `${selectedProyek.alamat} · radius ${selectedProyek.radius_m}m` : "";
  resetRadar();
}
function resetRadar() {
  document.getElementById("absen-status").textContent = "Tekan tombol untuk absen di lokasi proyek";
  document.getElementById("absen-status").style.color = "var(--concrete)";
  document.getElementById("radar-dot").style.background = "#9AA5AC";
  document.getElementById("radar-pulse").style.background = "#9AA5AC";
  document.getElementById("radar-pulse").style.width = "0";
  document.getElementById("radar-pulse").style.height = "0";
}

/* ---------- absensi (GPS) ---------- */
function handleCheckIn() {
  if (!currentTukang) { alert("Masuk sebagai tukang untuk absen."); return; }
  const p = selectedProyek;
  if (!p) return;
  document.getElementById("absen-status").textContent = "Mengambil lokasi GPS…";
  document.getElementById("absen-status").style.color = "var(--concrete)";
  if (!navigator.geolocation) {
    document.getElementById("absen-status").textContent = "Perangkat tidak mendukung GPS.";
    document.getElementById("absen-status").style.color = "var(--bad)";
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude, longitude } = pos.coords;
    const dist = haversine(latitude, longitude, p.lat, p.lng);
    const valid = dist <= p.radius_m;
    updateRadar(dist, p.radius_m, valid);
    const entry = { tukang_id: currentTukang.id, proyek_id: p.id, lat: latitude, lng: longitude, jarak_m: Math.round(dist), valid };
    if (configured) {
      await supabase.from("absensi_log").insert(entry);
    } else {
      absensiLogLocal.unshift({ ...entry, id: Date.now(), tukang_nama: currentTukang.nama, proyek_nama: p.nama, created_at: new Date().toISOString() });
    }
    renderAbsensiRiwayat();
  }, () => {
    document.getElementById("absen-status").textContent = "Izin lokasi ditolak / gagal. Aktifkan GPS & izin lokasi.";
    document.getElementById("absen-status").style.color = "var(--bad)";
  }, { enableHighAccuracy: true, timeout: 10000 });
}

function updateRadar(dist, radius, valid) {
  const color = valid ? "#2C7A3D" : "#B23B3B";
  const ratio = Math.min(dist / radius, 1.8);
  const size = Math.min(46 + ratio * 60, 140);
  document.getElementById("radar-dot").style.background = color;
  document.getElementById("radar-pulse").style.background = color;
  document.getElementById("radar-pulse").style.opacity = "0.22";
  document.getElementById("radar-pulse").style.width = size + "px";
  document.getElementById("radar-pulse").style.height = size + "px";
  const statusEl = document.getElementById("absen-status");
  statusEl.style.color = color;
  statusEl.textContent = valid
    ? `Absen berhasil · ${Math.round(dist)}m dari lokasi`
    : `Di luar radius · ${Math.round(dist)}m dari lokasi`;
}

async function renderAbsensiRiwayat() {
  const el = document.getElementById("absen-riwayat");
  let rows = [];
  if (configured) {
    let q = supabase.from("absensi_log").select("*, tukang(nama), proyek(nama)").order("created_at", { ascending: false }).limit(10);
    if (!isAdmin) q = q.eq("tukang_id", currentTukang.id);
    const { data } = await q;
    rows = (data || []).map(r => ({ ...r, tukang_nama: r.tukang?.nama, proyek_nama: r.proyek?.nama }));
  } else {
    rows = isAdmin ? absensiLogLocal : absensiLogLocal.filter(r => r.tukang_id === currentTukang?.id);
  }
  if (rows.length === 0) { el.innerHTML = `<div class="empty">Belum ada riwayat absen.</div>`; return; }
  el.innerHTML = `<p class="hint" style="margin:6px 0;">Riwayat Absen</p>` + rows.map(r => `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:8px;">
      <div>
        <p style="margin:0;font-weight:600;font-size:13px;">${r.tukang_nama || ""}</p>
        <p style="margin:2px 0 0;font-size:12px;color:#6B7278;">${r.proyek_nama || ""} · ${r.jarak_m}m ${r.valid ? "✅" : "⚠️"}</p>
      </div>
      <span class="hint">${fmtTime(r.created_at)}</span>
    </div>`).join("");
}

/* ---------- foto kerja ---------- */
async function handlePhotoUpload(e) {
  if (!currentTukang) { alert("Masuk sebagai tukang untuk unggah foto."); return; }
  const files = Array.from(e.target.files || []);
  const proyekId = document.getElementById("foto-proyek").value;
  const proyek = proyekList.find(p => p.id === proyekId);
  const caption = document.getElementById("foto-caption").value;
  for (const f of files) {
    if (configured) {
      const path = `${proyekId}/${Date.now()}_${f.name}`;
      const { error } = await supabase.storage.from("foto-kerja").upload(path, f);
      if (error) { alert("Gagal unggah: " + error.message); continue; }
      const { data: urlData } = supabase.storage.from("foto-kerja").getPublicUrl(path);
      await supabase.from("foto_kerja").insert({
        tukang_id: currentTukang.id, proyek_id: proyekId, foto_url: urlData.publicUrl, keterangan: caption
      });
    } else {
      const dataUrl = await fileToDataUrl(f);
      fotoLogLocal.unshift({
        id: Date.now() + Math.random(), foto_url: dataUrl, keterangan: caption,
        tukang_nama: currentTukang.nama, proyek_nama: proyek?.nama, created_at: new Date().toISOString(),
        tukang_id: currentTukang.id
      });
    }
  }
  document.getElementById("foto-caption").value = "";
  document.getElementById("foto-input").value = "";
  renderFotoGrid();
}

async function renderFotoGrid() {
  const el = document.getElementById("foto-grid");
  let rows = [];
  if (configured) {
    let q = supabase.from("foto_kerja").select("*, tukang(nama), proyek(nama)").order("created_at", { ascending: false }).limit(20);
    if (!isAdmin) q = q.eq("tukang_id", currentTukang.id);
    const { data } = await q;
    rows = (data || []).map(r => ({ ...r, tukang_nama: r.tukang?.nama, proyek_nama: r.proyek?.nama }));
  } else {
    rows = isAdmin ? fotoLogLocal : fotoLogLocal.filter(r => r.tukang_id === currentTukang?.id);
  }
  if (rows.length === 0) { el.innerHTML = `<div class="empty">Belum ada foto pekerjaan.</div>`; return; }
  el.innerHTML = `<div class="photo-grid">` + rows.map(r => `
    <div class="photo-card">
      <img src="${r.foto_url}" alt="${r.keterangan || ''}" />
      <div class="photo-meta">
        <p class="p-proyek">${r.proyek_nama || ""}</p>
        <p class="p-sub">${r.tukang_nama || ""}${r.keterangan ? " · " + r.keterangan : ""}</p>
        <p class="p-sub">${fmtTime(r.created_at)}</p>
      </div>
    </div>`).join("") + `</div>`;
}

/* ---------- kelola tukang (admin) ---------- */
async function renderTukangList() {
  const el = document.getElementById("tukang-list");
  el.innerHTML = tukangList.map(t => `
    <div class="tukang-item">
      <div>
        <p class="tukang-nama">${t.nama}</p>
        <p class="tukang-sub">${t.keahlian || ""} · ${t.hp || ""}</p>
      </div>
      <div style="text-align:right;">
        <span class="badge ${t.verified ? 'badge-ok' : 'badge-bad'}">${t.verified ? "Terverifikasi" : "Belum"}</span><br/>
        <button class="toggle-btn" style="margin-top:6px;background:${t.verified ? '#9AA5AC' : '#1C3F52'};" onclick="toggleVerified('${t.id}')">
          ${t.verified ? "Batalkan" : "Verifikasi"}
        </button>
      </div>
    </div>`).join("");
}

async function toggleVerified(id) {
  const t = tukangList.find(x => x.id === id);
  if (!t) return;
  t.verified = !t.verified;
  if (configured) {
    await supabase.from("tukang").update({ verified: t.verified }).eq("id", id);
  }
  renderTukangList();
  renderLoginSelect();
}

async function handleAddTukang() {
  const nama = document.getElementById("new-nama").value.trim();
  const keahlian = document.getElementById("new-keahlian").value.trim();
  const hp = document.getElementById("new-hp").value.trim();
  const pin = document.getElementById("new-pin").value.trim();
  if (!nama || pin.length !== 4) { alert("Isi nama dan PIN 4 digit."); return; }
  const entry = { nama, keahlian, hp, pin, verified: false };
  if (configured) {
    await supabase.from("tukang").insert(entry);
    const { data } = await supabase.from("tukang").select("*").order("nama");
    tukangList = data || [];
  } else {
    tukangList.push({ ...entry, id: "local-" + Date.now() });
  }
  ["new-nama","new-keahlian","new-hp","new-pin"].forEach(id => document.getElementById(id).value = "");
  renderTukangList();
  renderLoginSelect();
}

/* ---------- init ---------- */
loadData();
</script>
